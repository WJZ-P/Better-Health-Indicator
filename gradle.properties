org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=false
kotlin.code.style=official

# 所有 Gradle 仓库与依赖下载统一走本机系统代理。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.*|[::1]
systemProp.https.nonProxyHosts=localhost|127.*|[::1]

# 跨 Minecraft 版本保持一致的 Fabric/Kotlin 基础依赖。
loader_version=0.19.3
fabric_kotlin_version=1.13.11+kotlin.2.3.21

# Mod metadata
mod_id=better_health_indicator
mod_name=Better Health Indicator
mod_version=1.0.0
mod_group=com.wjz
mod_author=WJZ_P
mod_license=AGPL-3.0
mod_description=Say goodbye to boring health bars! Experience combat with a beautiful, dynamic, and smooth animated health indicator.
