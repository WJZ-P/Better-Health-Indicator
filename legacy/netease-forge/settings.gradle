pluginManagement {
    repositories {
        maven { url = uri('https://maven.wagyourtail.xyz/releases') }
        maven { url = uri('https://maven.wagyourtail.xyz/snapshots') }
        maven { url = uri('https://maven.minecraftforge.net/') }
        mavenCentral()
        gradlePluginPortal {
            content {
                excludeGroup('org.apache.logging.log4j')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'better-health-indicator-netease-legacy'

include 'netease-1.12.2', 'netease-1.11.2', 'netease-1.7.10'

project(':netease-1.12.2').projectDir = file('targets/netease-1.12.2')
project(':netease-1.11.2').projectDir = file('targets/netease-1.11.2')
project(':netease-1.7.10').projectDir = file('targets/netease-1.7.10')
